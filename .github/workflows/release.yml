name: Release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v5

      - name: Validate tag and manifest version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported tag format: $TAG"
            echo "Expected 2026.8.0 or 2026.8.0-beta.1"
            exit 1
          fi

          MANIFEST_VERSION="$(
            python3 -c '
          import json
          from pathlib import Path

          manifest = Path("custom_components/strydx_ble/manifest.json")
          print(json.loads(manifest.read_text())["version"])
          '
          )"

          if [[ "$MANIFEST_VERSION" != "$TAG" ]]; then
            echo "::error::Manifest version '$MANIFEST_VERSION' does not match tag '$TAG'."
            exit 1
          fi

      - name: Validate integration files
        shell: bash
        run: |
          python3 -m compileall -q custom_components/strydx_ble

          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path("custom_components/strydx_ble").rglob("*.json"):
              with path.open(encoding="utf-8") as file:
                  json.load(file)
              print(f"Valid JSON: {path}")
          PY

      - name: Build HACS archive
        shell: bash
        run: |
          rm -f strydx_ble.zip

          cd custom_components/strydx_ble
          zip -r ../../strydx_ble.zip . \
            -x "__pycache__/*" \
            -x "*.pyc"
          cd ../..

          unzip -l strydx_ble.zip

          unzip -p strydx_ble.zip manifest.json >/dev/null

      - name: Determine release type
        id: type
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARGS=(
            "${GITHUB_REF_NAME}"
            "strydx_ble.zip"
            --repo "${GITHUB_REPOSITORY}"
            --title "Stryd BLE ${GITHUB_REF_NAME}"
            --generate-notes
          )

          if [[ "${{ steps.type.outputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
